<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>महाडीबीटी शेतकरी योजना (MahaDBT Farmer Agriculture Subsidy)</title>
  <style>
    @keyframes cdp_heartbeat { 0% { opacity: 0.999; } 50% { opacity: 1; } 100% { opacity: 0.999; } }
    :root {
      --bg-dark: #0f172a;
      --surface-dark: #1e293b;
      --border-dark: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --success-bg: #052e16;
      --success-border: #15803d;
      --success-text: #86efac;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.5;
      animation: cdp_heartbeat 1s infinite linear;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 14px;
      margin-bottom: 24px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tag {
      background: #14532d;
      color: #bbf7d0;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }
    .card {
      background: var(--surface-dark);
      border-radius: 12px;
      padding: 28px;
      border: 1px solid var(--border-dark);
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #f1f5f9;
      font-size: 20px;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 12px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #090d16;
      color: #ffffff;
      font-size: 16px;
      min-height: 48px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.25);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      min-height: 52px;
      width: 100%;
      margin-top: 14px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .success-box {
      display: none;
      margin-top: 22px;
      padding: 18px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      border-radius: 8px;
      color: var(--success-text);
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🚜 महाडीबीटी - कृषी यांत्रिकीकरण अनुदान पोर्टल</div>
    <div class="tag">प्रत्यक्ष लाभ हस्तांतरण (DBT)</div>
  </div>

  <div class="card">
    <h2>कृषी औजारे व ठिबक सिंचन अनुदान अर्ज</h2>

    <div class="form-group">
      <label for="farmer_id">शेतकरी आधार / नोंदणी क्रमांक (Farmer ID):</label>
      <input type="text" id="farmer_id" name="farmer_id" placeholder="उदा. MH-AGRI-1092 किंवा 12 अंकी आधार क्रमांक..." autocomplete="off" />
    </div>

    <div class="form-group">
      <label for="scheme_select">योजनेचा घटक (Scheme Component):</label>
      <select id="scheme_select" name="scheme">
        <option value="">-- घटक निवडा --</option>
        <option value="drip" selected>ठिबक सिंचन योजना (८०% अनुदान)</option>
        <option value="tractor">ट्रॅक्टर औजारे व अवजारे अनुदान</option>
        <option value="solar">सौर कृषी पंप योजना</option>
        <option value="shade_net">शेडनेट हाऊस / पॉलिहाऊस उभारणी</option>
      </select>
    </div>

    <div class="form-group">
      <label for="subsidy_land">जमीन धारणा क्षेत्र (Land Holding in Acres):</label>
      <input type="number" id="subsidy_land" name="land_holding" placeholder="क्षेत्र (एकर मध्ये)..." value="2.5" min="0" step="0.1" />
    </div>

    <button type="button" class="btn" id="apply_subsidy_btn" onclick="applySubsidy()">अनुदान अर्ज सादर करा</button>

    <div class="success-box" id="subsidy_msg">
      <div>🚜 महाडीबीटी: अनुदान अर्ज यशस्वीपणे स्वीकारण्यात आला आहे!</div>
      <div style="margin-top:8px; font-family:monospace; color:#bbf7d0;">अर्ज क्रमांक: MAHA-DBT-2026-7712</div>
      <div style="margin-top:4px; font-size:13px; color:#cbd5e1;">आपल्या अर्जाची स्थिती लवकरच SMS द्वारे कळविण्यात येईल.</div>
    </div>
  </div>

  <script>
    function applySubsidy() {
      document.getElementById('subsidy_msg').style.display = 'block';
    }
  </script>
</body>
</html>
